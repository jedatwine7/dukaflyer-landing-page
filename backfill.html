    window.runBackfill = async function() {
      const btn = document.getElementById('runBtn');
      const log = document.getElementById('log');
      btn.disabled = true;
      btn.textContent = 'Running...';
      log.textContent = '';

      let success = 0, failed = 0;

      for (const shop of historicalShops) {
        try {
          await addDoc(collection(db, 'marketData'), {
            shopName: shop.name,
            category: shop.category,
            region: shop.region,
            source: 'historical_backfill',
            createdAt: new Date().toISOString()
          });
          success++;
          log.textContent += `✓ ${shop.name}\n`;
        } catch (e) {
          failed++;
          log.textContent += `✗ FAILED: ${shop.name} — ${e.message}\n`;
        }
        log.scrollTop = log.scrollHeight;
      }

      btn.textContent = 'Done';
      log.textContent += `\n\n=== COMPLETE: ${success} added, ${failed} failed ===`;
