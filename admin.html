<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — DukaFlyer</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1a7a4a;
      --green-light: #22a86a;
      --green-pale: #e8f7ef;
      --yellow: #f5c800;
      --yellow-pale: #fffbe6;
      --dark: #0f1a13;
      --mid: #3a4a3f;
      --muted: #7a8a7f;
      --white: #ffffff;
      --bg: #f7faf8;
      --card: #ffffff;
      --border: #e0ebe4;
      --radius: 16px;
      --error: #c0392b;
      --error-bg: #fff0f0;
      --warning: #d4800a;
      --warning-bg: #fff8ed;
    }

    html, body {
      min-height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOADING ── */
    #loadingScreen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 999;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingScreen p { font-size: 0.9rem; color: var(--muted); font-weight: 500; }

    /* ── ACCESS DENIED ── */
    #accessDenied {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      flex-direction: column;
      gap: 12px;
    }

    #accessDenied.show { display: flex; }
    #accessDenied .emoji { font-size: 3rem; }
    #accessDenied h2 { font-size: 1.4rem; font-weight: 800; }
    #accessDenied p { font-size: 0.9rem; color: var(--muted); }

    /* ── NAV ── */
    nav {
      background: var(--dark);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }

    .logo { font-size: 1.2rem; font-weight: 800; color: white; letter-spacing: -0.5px; }
    .logo span { color: var(--yellow); }
    .admin-badge {
      background: var(--yellow);
      color: var(--dark);
      font-size: 0.7rem; font-weight: 800;
      padding: 3px 10px; border-radius: 100px;
      letter-spacing: 0.5px;
    }

    .nav-left { display: flex; align-items: center; gap: 12px; }

    .btn-sm {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 0.8rem; font-weight: 600;
      color: rgba(255,255,255,0.7); cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .btn-sm:hover { background: rgba(255,255,255,0.2); }

    /* ── MAIN ── */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (min-width: 500px) {
      .stats-row { grid-template-columns: repeat(4, 1fr); }
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.8rem; font-weight: 800;
      color: var(--green); letter-spacing: -1px;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.72rem; color: var(--muted);
      font-weight: 500; margin-top: 4px;
    }

    /* ── FILTERS ── */
    .filters {
      display: flex; gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 100px;
      padding: 7px 16px;
      font-size: 0.8rem; font-weight: 600;
      color: var(--muted); cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .search-input {
      flex: 1; min-width: 180px;
      padding: 8px 14px;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      font-size: 0.85rem; font-family: inherit;
      color: var(--dark); background: var(--card);
      outline: none;
    }

    .search-input:focus { border-color: var(--green); }

    /* ── SHOPS TABLE ── */
    .shops-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .shops-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      justify-content: space-between;
    }

    .shops-title {
      font-size: 0.95rem; font-weight: 700; color: var(--dark);
    }

    .shops-count {
      font-size: 0.8rem; color: var(--muted);
    }

    .shop-row {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      gap: 14px; flex-wrap: wrap;
    }

    .shop-row:last-child { border-bottom: none; }

    .shop-avatar {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--green-pale);
      color: var(--green);
      font-weight: 800; font-size: 1rem;
      display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }

    .shop-info { flex: 1; min-width: 140px; }

    .shop-name {
      font-size: 0.92rem; font-weight: 700;
      color: var(--dark); margin-bottom: 2px;
    }

    .shop-meta {
      font-size: 0.75rem; color: var(--muted);
      display: flex; gap: 8px; flex-wrap: wrap;
    }

    .shop-meta span { display: flex; align-items: center; gap: 3px; }

    .status-badge {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 0.72rem; font-weight: 700;
      flex-shrink: 0;
    }

    .status-badge.trial {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .status-badge.active {
      background: var(--green-pale);
      color: var(--green);
    }

    .status-badge.expired {
      background: var(--error-bg);
      color: var(--error);
    }

    .status-badge.inactive {
      background: #f0f0f0;
      color: #888;
    }

    .shop-actions {
      display: flex; gap: 6px; flex-shrink: 0;
    }

    .btn-activate {
      background: var(--green);
      color: white; border: none;
      border-radius: 100px; padding: 7px 14px;
      font-size: 0.75rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }

    .btn-activate:hover { background: var(--green-light); }

    .btn-deactivate {
      background: none;
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: 100px; padding: 7px 14px;
      font-size: 0.75rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }

    .btn-deactivate:hover { background: var(--error-bg); }

    .btn-verify {
      background: #e8f0fe; color: #1877f2;
      border: 1px solid #1877f2;
      border-radius: 100px; padding: 7px 14px;
      font-size: 0.75rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }

    .btn-verify:hover { background: #1877f2; color: white; }

    .btn-unverify {
      background: none; color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 100px; padding: 7px 14px;
      font-size: 0.75rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }

    .btn-unverify:hover { background: var(--bg); }

    .verified-pill {
      background: #e8f0fe; color: #1877f2;
      border-radius: 100px; padding: 2px 8px;
      font-size: 0.68rem; font-weight: 700;
    }

    .btn-whatsapp-contact {
      background: #25d366;
      color: white; border: none;
      border-radius: 100px; padding: 7px 12px;
      font-size: 0.75rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }

    .btn-whatsapp-contact:hover { background: #1ebe5d; }

    .btn-view-shop {
      background: none;
      color: var(--green);
      border: 1px solid var(--border);
      border-radius: 100px; padding: 7px 12px;
      font-size: 0.75rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
      text-decoration: none;
      transition: border-color 0.2s;
    }

    .btn-view-shop:hover { border-color: var(--green); }

    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state .emoji { font-size: 2rem; margin-bottom: 8px; }
    .empty-state p { font-size: 0.88rem; }

    /* ── TRIAL DAYS ── */
    .days-pill {
      font-size: 0.72rem; font-weight: 600;
      padding: 2px 8px; border-radius: 100px;
    }

    .days-pill.urgent { background: var(--error-bg); color: var(--error); }
    .days-pill.warning { background: var(--warning-bg); color: var(--warning); }
    .days-pill.ok { background: var(--green-pale); color: var(--green); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dark); color: white;
      border-radius: 100px; padding: 12px 24px;
      font-size: 0.85rem; font-weight: 600;
      z-index: 500; transition: transform 0.3s ease;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Loading admin panel...</p>
  </div>

  <div id="accessDenied">
    <div class="emoji">🔒</div>
    <h2>Access denied</h2>
    <p>You don't have permission to view this page.</p>
  </div>

  <div class="toast" id="toast"></div>

  <nav>
    <div class="nav-left">
      <div class="logo">Duka<span>Flyer</span></div>
      <span class="admin-badge">ADMIN</span>
    </div>
    <button class="btn-sm" onclick="signOut()">Sign out</button>
  </nav>

  <div class="main" id="mainContent" style="display:none">

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Total Shops</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statActive">0</div>
        <div class="stat-label">Active (Paid)</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statTrial">0</div>
        <div class="stat-label">On Trial</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statExpired">0</div>
        <div class="stat-label">Expired</div>
      </div>
    </div>

    <!-- FILTERS -->
    <div class="filters">
      <input class="search-input" id="searchInput" placeholder="🔍 Search shops..." oninput="filterShops()" />
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('trial', this)">Trial</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" onclick="setFilter('expired', this)">Expired</button>
      <button class="filter-btn" onclick="setFilter('inactive', this)">Inactive</button>
    </div>

    <!-- SHOPS LIST -->
    <div class="shops-card">
      <div class="shops-header">
        <div class="shops-title">All Shops</div>
        <div class="shops-count" id="shopsCount"></div>
      </div>
      <div id="shopsList"></div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYEQQMbfR_YHq5nISaFRgZ0SOuAHWHWWU",
      authDomain: "dukaflyer-ea62e.firebaseapp.com",
      projectId: "dukaflyer-ea62e",
      storageBucket: "dukaflyer-ea62e.firebasestorage.app",
      messagingSenderId: "149788171032",
      appId: "1:149788171032:web:2ddeb453162284eed8dc6d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ── ADMIN UID — your Firebase user ID ──
    const ADMIN_UID = 'TByGntGU5EaSIQOZih91Fd5sbZq1';

    let allShops = [];
    let activeFilter = 'all';
    let viewCounts = {};
    let clickCounts = {};

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.uid !== ADMIN_UID) {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('accessDenied').classList.add('show');
        return;
      }

      await loadShops();
    });

    function countBySlug(docs) {
      const counts = {};
      docs.forEach(d => {
        const slug = d.data().slug;
        if (!slug) return;
        counts[slug] = (counts[slug] || 0) + 1;
      });
      return counts;
    }

    async function loadShops() {
      try {
        const [shopsSnap, viewsSnap, clicksSnap] = await Promise.all([
          getDocs(collection(db, 'shops')),
          getDocs(collection(db, 'views')),
          getDocs(collection(db, 'whatsappClicks'))
        ]);

        allShops = shopsSnap.docs.map(d => ({ ...d.data(), docId: d.id }));
        viewCounts = countBySlug(viewsSnap.docs);
        clickCounts = countBySlug(clicksSnap.docs);

        // Sort by createdAt desc
        allShops.sort((a, b) => {
          const aT = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
          const bT = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
          return bT - aT;
        });

        renderStats();
        renderShops(allShops);

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

      } catch (e) {
        console.error(e);
        document.getElementById('loadingScreen').style.display = 'none';
      }
    }

    function getShopStatus(shop) {
      if (shop.status === 'active') return 'active';
      if (shop.status === 'inactive') return 'inactive';
      if (shop.status === 'trial') {
        const trialEnd = shop.trialEndsAt?.toDate ? shop.trialEndsAt.toDate() : new Date(shop.trialEndsAt || 0);
        if (new Date() > trialEnd) return 'expired';
        return 'trial';
      }
      return 'trial';
    }

    function getDaysLeft(shop) {
      const trialEnd = shop.trialEndsAt?.toDate ? shop.trialEndsAt.toDate() : new Date(shop.trialEndsAt || 0);
      return Math.max(0, Math.ceil((trialEnd - new Date()) / (1000 * 60 * 60 * 24)));
    }

    function renderStats() {
      document.getElementById('statTotal').textContent = allShops.length;
      document.getElementById('statActive').textContent = allShops.filter(s => getShopStatus(s) === 'active').length;
      document.getElementById('statTrial').textContent = allShops.filter(s => getShopStatus(s) === 'trial').length;
      document.getElementById('statExpired').textContent = allShops.filter(s => getShopStatus(s) === 'expired').length;
    }

    function renderShops(shops) {
      const list = document.getElementById('shopsList');
      document.getElementById('shopsCount').textContent = shops.length + ' shop' + (shops.length !== 1 ? 's' : '');

      if (shops.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🏪</div>
            <p>No shops found</p>
          </div>`;
        return;
      }

      list.innerHTML = shops.map(shop => {
        const status = getShopStatus(shop);
        const daysLeft = getDaysLeft(shop);
        const products = (shop.products || []).length;
        const views = viewCounts[shop.slug] || 0;
        const clicks = clickCounts[shop.slug] || 0;
        const createdAt = shop.createdAt?.toDate
          ? shop.createdAt.toDate().toLocaleDateString('en-UG', { day: 'numeric', month: 'short', year: 'numeric' })
          : 'Unknown';

        // Days left pill
        let daysPill = '';
        if (status === 'trial') {
          daysPill = `<span class="days-pill ${daysLeft <= 1 ? 'urgent' : daysLeft <= 3 ? 'warning' : 'ok'}">${daysLeft}d trial left</span>`;
        } else if (status === 'active' && shop.subscriptionEndsAt) {
          const subEnd = shop.subscriptionEndsAt?.toDate ? shop.subscriptionEndsAt.toDate() : new Date(shop.subscriptionEndsAt);
          const subDays = Math.max(0, Math.ceil((subEnd - new Date()) / (1000 * 60 * 60 * 24)));
          daysPill = `<span class="days-pill ${subDays <= 3 ? 'urgent' : subDays <= 7 ? 'warning' : 'ok'}">${subDays}d sub left</span>`;
        }

        const actionBtns = status === 'active'
          ? `<button class="btn-deactivate" onclick="updateStatus('${shop.docId}', 'inactive')">Deactivate</button>`
          : `<button class="btn-activate" onclick="updateStatus('${shop.docId}', 'active')">Activate</button>`;

        const verifyBtn = shop.verified
          ? `<button class="btn-unverify" onclick="toggleVerify('${shop.docId}', false)" title="Remove verification">✓ Verified</button>`
          : `<button class="btn-verify" onclick="toggleVerify('${shop.docId}', true)" title="Mark as verified">Verify</button>`;

        return `
          <div class="shop-row">
            <div class="shop-avatar">${shop.shopName?.[0]?.toUpperCase() || '?'}</div>
            <div class="shop-info">
              <div class="shop-name">${shop.shopName || 'Unnamed'}</div>
              <div class="shop-meta">
                <span>📍 ${shop.region || '—'}</span>
                <span>📦 ${products} product${products !== 1 ? 's' : ''}</span>
                <span>📅 ${createdAt}</span>
                <span>👁️ ${views} view${views !== 1 ? 's' : ''}</span>
                <span>💬 ${clicks} WhatsApp click${clicks !== 1 ? 's' : ''}</span>
                ${daysPill}
              </div>
            </div>
            <span class="status-badge ${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
            <div class="shop-actions">
              <a class="btn-view-shop" href="https://dukaflyer.com/shop/${shop.slug}" target="_blank">View</a>
              <button class="btn-whatsapp-contact" onclick="contactMerchant('${shop.whatsapp}', '${shop.shopName}')">💬</button>
              ${verifyBtn}
              ${actionBtns}
            </div>
          </div>`;
      }).join('');
    }

    // Filter
    window.setFilter = function(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterShops();
    };

    window.filterShops = function() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allShops;

      if (activeFilter !== 'all') {
        filtered = filtered.filter(s => getShopStatus(s) === activeFilter);
      }

      if (query) {
        filtered = filtered.filter(s =>
          (s.shopName || '').toLowerCase().includes(query) ||
          (s.region || '').toLowerCase().includes(query) ||
          (s.category || '').toLowerCase().includes(query) ||
          (s.ownerEmail || '').toLowerCase().includes(query)
        );
      }

      renderShops(filtered);
    };

    // Activate / Deactivate
    window.updateStatus = async function(docId, newStatus) {
      try {
        const updates = { status: newStatus };

        if (newStatus === 'active') {
          // Set subscription to expire 30 days from now
          const subEnd = new Date();
          subEnd.setDate(subEnd.getDate() + 30);
          updates.subscriptionEndsAt = subEnd;
          updates.lastActivatedAt = new Date();
        }

        await updateDoc(doc(db, 'shops', docId), updates);
        const shop = allShops.find(s => s.docId === docId);
        if (shop) {
          shop.status = newStatus;
          if (newStatus === 'active') shop.subscriptionEndsAt = updates.subscriptionEndsAt;
        }
        renderStats();
        filterShops();
        showToast(newStatus === 'active' ? '✓ Shop activated for 30 days' : '✓ Shop deactivated');
      } catch (e) {
        showToast('Something went wrong. Try again.');
      }
    };

    // Verify / Unverify
    window.toggleVerify = async function(docId, verified) {
      try {
        await updateDoc(doc(db, 'shops', docId), { verified });
        const shop = allShops.find(s => s.docId === docId);
        if (shop) shop.verified = verified;
        filterShops();
        showToast(verified ? '✓ Shop verified' : 'Verification removed');
      } catch(e) {
        showToast('Something went wrong. Try again.');
      }
    };

    // Contact merchant on WhatsApp
    window.contactMerchant = function(whatsapp, shopName) {
      const msg = encodeURIComponent(`Hi, this is DukaFlyer. We're reaching out regarding your shop "${shopName}". `);
      window.open(`https://wa.me/${whatsapp}?text=${msg}`, '_blank');
    };

    // Sign out
    window.signOut = async function() {
      await fbSignOut(auth);
      window.location.href = 'index.html';
    };

    // Toast
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>

</body>
