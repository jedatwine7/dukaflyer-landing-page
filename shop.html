<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop | DukaFlyer</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="description" content="Shop online and order via WhatsApp" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1a7a4a;
      --green-light: #22a86a;
      --green-pale: #e8f7ef;
      --yellow: #f5c800;
      --dark: #0f1a13;
      --mid: #3a4a3f;
      --muted: #7a8a7f;
      --white: #ffffff;
      --bg: #f7faf8;
      --card: #ffffff;
      --border: #e0ebe4;
      --radius: 16px;
      --whatsapp: #25d366;
      --verified: #1877f2;
      --verified-pale: #e8f0fe;
    }

    html, body {
      min-height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOADING ── */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 999;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loadingScreen p { font-size: 0.9rem; color: var(--muted); font-weight: 500; }

    /* ── NOT FOUND ── */
    #notFound {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      flex-direction: column;
      gap: 12px;
    }

    #notFound.show { display: flex; }
    #notFound .emoji { font-size: 3rem; }
    #notFound h2 { font-size: 1.4rem; font-weight: 800; color: var(--dark); }
    #notFound p { font-size: 0.9rem; color: var(--muted); }
    #notFound a {
      margin-top: 8px;
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }

    #inactiveScreen, #trialExpiredScreen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      flex-direction: column;
      gap: 12px;
    }
    #inactiveScreen.show, #trialExpiredScreen.show { display: flex; }
    #inactiveScreen .emoji, #trialExpiredScreen .emoji { font-size: 3rem; }
    #inactiveScreen h2, #trialExpiredScreen h2 { font-size: 1.4rem; font-weight: 800; color: var(--dark); }
    #inactiveScreen p, #trialExpiredScreen p { font-size: 0.9rem; color: var(--muted); }
    #inactiveScreen a, #trialExpiredScreen a {
      margin-top: 8px;
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* ── SHOP CONTENT ── */
    #shopContent { display: none; }
    #shopContent.show { display: block; }

    /* ── SHOP HEADER ── */
    .shop-header {
      background: var(--green);
      padding: 32px 24px 80px;
      text-align: center;
      position: relative;
    }

    .shop-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .powered-by {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      font-weight: 500;
    }

    .powered-by span { color: var(--yellow); font-weight: 700; }

    .cart-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 100px;
      padding: 8px 16px;
      color: white;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .cart-btn:hover { background: rgba(255,255,255,0.25); }

    .cart-count {
      background: var(--yellow);
      color: var(--dark);
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 1px 7px;
      min-width: 20px;
      text-align: center;
    }

    .shop-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 3px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: white;
      margin: 0 auto 16px;
    }

    .shop-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .shop-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .shop-tag {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.9);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    /* ── SEARCH + FILTER ── */
    .search-bar-wrap {
      max-width: 700px;
      margin: -32px auto 0;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }

    .search-bar {
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(15,26,19,0.12);
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 10px;
    }

    .search-icon { font-size: 1.1rem; flex-shrink: 0; }

    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--dark);
      background: transparent;
    }

    .search-bar input::placeholder { color: var(--muted); }

    /* ── CATEGORY FILTERS ── */
    #categoryFilters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 16px 16px 20px;
      padding-bottom: 4px;
      scrollbar-width: none;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    #categoryFilters::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .filter-chip.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }
    .filter-chip:hover:not(.active) {
      border-color: var(--green);
      color: var(--green);
    }

    /* ── MAIN CONTENT ── */
    .main {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 16px 120px;
    }

    /* ── STATS ── */
    .shop-stats {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      flex: 1;
      text-align: center;
    }

    .stat-num {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--green);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* ── PRODUCTS GRID ── */
    .products-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .products-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--dark);
    }

    .products-count {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 500px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .product-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15,26,19,0.1);
    }

    .product-photo {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--green-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .product-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 10px 12px 12px;
    }

    .product-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--green);
    }

    .product-price span {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--muted);
    }

    .add-btn {
      width: 100%;
      margin-top: 8px;
      background: var(--green-pale);
      color: var(--green);
      border: none;
      border-radius: 8px;
      padding: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .add-btn:hover { background: var(--green); color: white; }
    .add-btn.added { background: var(--green); color: white; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }

    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; }

    /* ── CART DRAWER ── */
    .cart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,26,19,0.5);
      z-index: 100;
    }

    .cart-overlay.open { display: block; }

    .cart-drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--white);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 40px;
      z-index: 101;
      max-height: 80vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .cart-drawer.open { transform: translateY(0); }

    .cart-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin
