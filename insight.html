<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Market Insight — DukaFlyer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1a7a4a;
      --green-light: #22a86a;
      --green-pale: #e8f7ef;
      --yellow: #f5c800;
      --dark: #0f1a13;
      --mid: #3a4a3f;
      --muted: #7a8a7f;
      --white: #ffffff;
      --bg: #f7faf8;
      --card: #ffffff;
      --border: #e0ebe4;
      --radius: 16px;
    }

    html, body {
      min-height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }

    #loadingScreen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 999;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingScreen p { font-size: 0.9rem; color: var(--muted); font-weight: 500; }

    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }

    .logo { font-size: 1.3rem; font-weight: 800; color: var(--green); letter-spacing: -0.5px; }
    .logo span { color: var(--yellow); }

    .back-btn {
      background: none; border: 1px solid var(--border);
      border-radius: 100px; padding: 6px 14px;
      font-size: 0.8rem; font-weight: 600; color: var(--muted);
      cursor: pointer; font-family: inherit; text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }

    .back-btn:hover { border-color: var(--green); color: var(--green); }

    .hero {
      background: linear-gradient(135deg, var(--dark) 0%, #1a3a2a 100%);
      padding: 36px 20px 44px; text-align: center;
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(245,200,0,0.15);
      border: 1px solid rgba(245,200,0,0.3);
      color: var(--yellow); border-radius: 100px;
      padding: 6px 16px; font-size: 0.78rem; font-weight: 700;
      margin-bottom: 14px; letter-spacing: 0.5px;
    }

    .hero h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 800; color: white;
      letter-spacing: -0.6px; margin-bottom: 8px; line-height: 1.2;
    }

    .hero p {
      font-size: 0.88rem; color: rgba(255,255,255,0.6);
      max-width: 380px; margin: 0 auto; line-height: 1.6;
    }

    .main { max-width: 640px; margin: 0 auto; padding: 28px 16px 80px; }

    .selector-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
    }

    .selector-title {
      font-size: 0.9rem; font-weight: 700; color: var(--dark); margin-bottom: 14px;
    }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--mid); margin-bottom: 6px;
    }

    select {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 0.92rem; font-family: inherit; color: var(--dark);
      background: var(--white); outline: none;
      transition: border-color 0.2s; -webkit-appearance: none;
    }

    select:focus { border-color: var(--green); }

    .btn-analyze {
      width: 100%; background: var(--green); color: white;
      border: none; border-radius: 100px; padding: 14px;
      font-size: 0.92rem; font-weight: 700; cursor: pointer;
      font-family: inherit; margin-top: 16px;
      transition: background 0.2s;
    }

    .btn-analyze:hover { background: var(--green-light); }

    /* RESULTS */
    #results { display: none; }
    #results.show { display: block; }

    .insight-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px; margin-bottom: 16px;
    }

    .insight-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    }

    .insight-icon {
      width: 36px; height: 36px; background: var(--green-pale);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 1.1rem;
    }

    .insight-title { font-size: 1rem; font-weight: 700; color: var(--dark); }

    .big-stat {
      text-align: center; padding: 16px 0;
    }

    .big-stat-num {
      font-size: 2.4rem; font-weight: 800; color: var(--green);
      letter-spacing: -1.5px; line-height: 1;
    }

    .big-stat-label {
      font-size: 0.82rem; color: var(--muted); margin-top: 6px;
    }

    .rank-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

    .rank-row {
      display: flex; align-items: center; gap: 12px;
    }

    .rank-num {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--green-pale); color: var(--green);
      font-size: 0.78rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .rank-info { flex: 1; }

    .rank-name {
      font-size: 0.85rem; font-weight: 700; color: var(--dark);
      display: flex; justify-content: space-between;
      margin-bottom: 4px;
    }

    .rank-name span { color: var(--green); font-weight: 800; }

    .rank-bar-bg {
      height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden;
    }

    .rank-bar-fill {
      height: 100%; background: var(--green); border-radius: 3px;
      transition: width 0.6s ease;
    }

    .verdict-box {
      background: var(--green-pale); border-radius: 12px;
      padding: 16px; margin-top: 16px;
    }

    .verdict-box p {
      font-size: 0.85rem; color: var(--mid); line-height: 1.6;
    }

    .verdict-box strong { color: var(--green); }

    .disclaimer {
      font-size: 0.74rem; color: var(--muted);
      text-align: center; margin-top: 16px; line-height: 1.6;
      padding: 0 12px;
    }

    .cta-ad {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 8px;
      background: linear-gradient(135deg,#1877f2,#e1306c);
      color: white; border: none; border-radius: 100px;
      padding: 14px; font-size: 0.9rem; font-weight: 800;
      cursor: pointer; font-family: inherit; text-decoration: none;
      transition: opacity 0.2s;
    }

    .cta-ad:hover { opacity: 0.9; }

    .empty-data {
      text-align: center; padding: 30px 20px; color: var(--muted);
    }

    .empty-data .emoji { font-size: 2rem; margin-bottom: 8px; }
    .empty-data p { font-size: 0.85rem; }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Loading market data...</p>
  </div>

  <nav>
    <div class="logo">Duka<span>Flyer</span></div>
    <a class="back-btn" href="/dashboard">← Dashboard</a>
  </nav>

  <div class="hero">
    <div class="hero-badge">📊 Market Insight</div>
    <h1>What's selling where in Uganda</h1>
    <p>Real data from DukaFlyer merchants — see what's popular before you decide what to sell or where to target.</p>
  </div>

  <div class="main" id="mainContent" style="display:none">

    <div class="selector-card">
      <div class="selector-title">Check the market</div>
      <div class="field">
        <label>Category</label>
        <select id="categorySelect">
          <option value="">All categories</option>
          <option>Fashion & Clothing</option>
          <option>Food & Drinks</option>
          <option>Electronics</option>
          <option>Beauty & Cosmetics</option>
          <option>Furniture & Home</option>
          <option>Phones & Accessories</option>
          <option>Groceries</option>
          <option>Pharmacy & Health</option>
          <option>Hardware & Building</option>
          <option>Agriculture</option>
          <option>Stationery & Books</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Region</label>
        <select id="regionSelect">
          <option value="">All regions</option>
          <option>Kampala</option>
          <option>Central Uganda</option>
          <option>Wakiso</option>
          <option>Mukono</option>
          <option>Jinja</option>
          <option>Mbarara</option>
          <option>Gulu</option>
          <option>Lira</option>
          <option>Fort Portal</option>
          <option>Masaka</option>
          <option>Mbale</option>
          <option>Soroti</option>
          <option>Arua</option>
          <option>Kabale</option>
          <option>Entebbe</option>
          <option>Hoima</option>
        </select>
      </div>
      <button class="btn-analyze" onclick="analyze()">🔍 Show Market Data</button>
    </div>

    <div id="results"></div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYEQQMbfR_YHq5nISaFRgZ0SOuAHWHWWU",
      authDomain: "dukaflyer-ea62e.firebaseapp.com",
      projectId: "dukaflyer-ea62e",
      storageBucket: "dukaflyer-ea62e.firebasestorage.app",
      messagingSenderId: "149788171032",
      appId: "1:149788171032:web:2ddeb453162284eed8dc6d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let marketData = [];
    let viewsData = [];
    let shopsData = [];

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      await loadData();
    });

    async function loadData() {
      try {
        const marketSnap = await getDocs(collection(db, 'marketData'));
        marketData = marketSnap.docs.map(d => d.data());

        const shopsSnap = await getDocs(collection(db, 'shops'));
        shopsData = shopsSnap.docs.map(d => d.data());

        try {
          const viewsSnap = await getDocs(collection(db, 'views'));
          viewsData = viewsSnap.docs.map(d => d.data());
        } catch(e) { viewsData = []; }

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        // Auto-run with no filters first time
        analyze();
      } catch (e) {
        console.error(e);
        document.getElementById('loadingScreen').innerHTML = '<p>Could not load market data. Please try again.</p>';
      }
    }

    function formatNum(n) {
      return Number(n).toLocaleString();
    }

    window.analyze = function() {
      const category = document.getElementById('categorySelect').value;
      const region = document.getElementById('regionSelect').value;

      const results = document.getElementById('results');
      results.classList.add('show');

      // Combine marketData with live shop categories/regions for completeness
      let combined = [...marketData];

      // Filter views the same way
      let viewPool = [...viewsData];
      if (category) viewPool = viewPool.filter(v => v.category === category);
      if (region) viewPool = viewPool.filter(v => v.region === region);
      const totalViews = viewPool.length;

      // View counts by category (for ranking)
      let viewsByCategory = {};
      let viewsByCategoryPool = [...viewsData];
      if (region) viewsByCategoryPool = viewsByCategoryPool.filter(v => v.region === region);
      viewsByCategoryPool.forEach(v => {
        const cat = v.category || 'Other';
        viewsByCategory[cat] = (viewsByCategory[cat] || 0) + 1;
      });
      const sortedViewCategories = Object.entries(viewsByCategory).sort((a,b) => b[1] - a[1]);
      const maxViewCatCount = sortedViewCategories.length ? sortedViewCategories[0][1] : 0;

      // Category counts (filtered by region if selected)
      let categoryPool = combined;
      if (region) categoryPool = categoryPool.filter(d => d.region === region);

      const categoryCounts = {};
      categoryPool.forEach(d => {
        const cat = d.category || 'Other';
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
      });

      const sortedCategories = Object.entries(categoryCounts).sort((a,b) => b[1] - a[1]);
      const totalInPool = categoryPool.length;
      const maxCatCount = sortedCategories.length ? sortedCategories[0][1] : 0;

      // Region counts (filtered by category if selected)
      let regionPool = combined;
      if (category) regionPool = regionPool.filter(d => d.category === category);

      const regionCounts = {};
      regionPool.forEach(d => {
        const reg = d.region || 'Unknown';
        regionCounts[reg] = (regionCounts[reg] || 0) + 1;
      });

      const sortedRegions = Object.entries(regionCounts).sort((a,b) => b[1] - a[1]);
      const maxRegCount = sortedRegions.length ? sortedRegions[0][1] : 0;

      if (combined.length === 0) {
        results.innerHTML = `
          <div class="insight-card">
            <div class="empty-data">
              <div class="emoji">🌱</div>
              <p><strong style="color:var(--dark)">You could be one of the first!</strong><br>We're still gathering data from DukaFlyer merchants. Check back soon, or be the first to list in this category and set the trend.</p>
            </div>
          </div>`;
        return;
      }

      let html = '';

      // If specific category selected, show count + rank context
      if (category) {
        const countForCategory = categoryCounts[category] || 0;
        const pctOfTotal = totalInPool > 0 ? Math.round((countForCategory / totalInPool) * 100) : 0;
        const viewsForCategory = viewsByCategory[category] || 0;

        html += `
          <div class="insight-card">
            <div class="insight-header">
              <div class="insight-icon">🏪</div>
              <div class="insight-title">${category}${region ? ' in ' + region : ' in Uganda'}</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div class="big-stat" style="padding:12px 0">
                <div class="big-stat-num" style="font-size:1.9rem">${countForCategory}</div>
                <div class="big-stat-label">shops selling this</div>
              </div>
              <div class="big-stat" style="padding:12px 0">
                <div class="big-stat-num" style="font-size:1.9rem;color:#1877f2">${viewsForCategory}</div>
                <div class="big-stat-label">customer views logged</div>
              </div>
            </div>
            <div class="verdict-box">
              <p>${pctOfTotal >= 25
                ? `<strong>This is a popular category</strong> — ${pctOfTotal}% of shops${region ? ' in ' + region : ''} sell this. Expect competition, but also proven demand.`
                : pctOfTotal > 0
                ? `<strong>This is a smaller category</strong> — only ${pctOfTotal}% of shops sell this. Could mean less competition, or it could mean lower demand. Worth testing carefully.`
                : `<strong>No shops found yet</strong> in this exact category${region ? ' for ' + region : ''}. You could be early — that's an opportunity or a warning, test small first.`
              }
              ${viewsForCategory > 0 ? ` Customers have viewed shops in this category <strong>${viewsForCategory} time${viewsForCategory !== 1 ? 's' : ''}</strong> — a sign of real buyer interest, not just sellers.` : ''}</p>
            </div>
          </div>`;
      }

      // Top categories ranking
      if (sortedCategories.length > 0) {
        html += `
          <div class="insight-card">
            <div class="insight-header">
              <div class="insight-icon">🏆</div>
              <div class="insight-title">Top categories${region ? ' in ' + region : ' in Uganda'}</div>
            </div>
            <div class="rank-list">
              ${sortedCategories.slice(0, 6).map((entry, i) => {
                const [name, count] = entry;
                const width = maxCatCount > 0 ? Math.round((count / maxCatCount) * 100) : 0;
                return `
                  <div class="rank-row">
                    <div class="rank-num">${i+1}</div>
                    <div class="rank-info">
                      <div class="rank-name">${name} <span>${count}</span></div>
                      <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${width}%"></div></div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }

      // Most viewed categories (demand signal)
      if (sortedViewCategories.length > 0) {
        html += `
          <div class="insight-card">
            <div class="insight-header">
              <div class="insight-icon">👀</div>
              <div class="insight-title">Most viewed by customers${region ? ' in ' + region : ' in Uganda'}</div>
            </div>
            <div class="rank-list">
              ${sortedViewCategories.slice(0, 6).map((entry, i) => {
                const [name, count] = entry;
                const width = maxViewCatCount > 0 ? Math.round((count / maxViewCatCount) * 100) : 0;
                return `
                  <div class="rank-row">
                    <div class="rank-num" style="background:#e8f0fe;color:#1877f2">${i+1}</div>
                    <div class="rank-info">
                      <div class="rank-name">${name} <span style="color:#1877f2">${count} views</span></div>
                      <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${width}%;background:#1877f2"></div></div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
            <p style="font-size:0.74rem;color:var(--muted);margin-top:12px">This is real customer interest — categories getting browsed the most by buyers visiting DukaFlyer shops.</p>
          </div>`;
      }

      // Top regions ranking
      if (sortedRegions.length > 0) {
        html += `
          <div class="insight-card">
            <div class="insight-header">
              <div class="insight-icon">📍</div>
              <div class="insight-title">Top regions${category ? ' for ' + category : ' in Uganda'}</div>
            </div>
            <div class="rank-list">
              ${sortedRegions.slice(0, 6).map((entry, i) => {
                const [name, count] = entry;
                const width = maxRegCount > 0 ? Math.round((count / maxRegCount) * 100) : 0;
                return `
                  <div class="rank-row">
                    <div class="rank-num">${i+1}</div>
                    <div class="rank-info">
                      <div class="rank-name">${name} <span>${count}</span></div>
                      <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${width}%"></div></div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }

      html += `
        <p class="disclaimer">This shows how many DukaFlyer shops are selling in each category and region (supply data) — not confirmed sales. Use it as a starting signal, not a guarantee.</p>
        <a href="/advertise" class="cta-ad">📣 Advertise in this category / region</a>`;

      results.innerHTML = html;
    };
  </script>

</body>
</html>
